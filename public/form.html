<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comnet Project | Student Form</title>
    <meta name="description" content="Add a new student to the Computer Network database">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav>
        <a href="/" class="logo"><i class="fa-solid fa-network-wired"></i> ComnetProject</a>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/form">Student Entry</a>
        </div>
    </nav>

    <div class="container">
        <div class="glass-card" style="max-width: 700px; margin: 0 auto;">
            <h1 class="fade-in"><i class="fa-regular fa-id-card" style="color: var(--primary); margin-right: 15px;"></i>Student Registry</h1>
            <p class="subtitle fade-in delay-1">Enter the student's details below to register them in the system.</p>
            
            <form id="studentForm" class="fade-in delay-2">
                <div class="form-group">
                    <label class="form-label" for="student_id">Student ID</label>
                    <input type="text" class="form-control" id="student_id" name="student_id" placeholder="e.g. 62363172" required autocomplete="off">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="firstname">First Name</label>
                        <input type="text" class="form-control" id="firstname" name="firstname" placeholder="Enter first name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="lastname">Last Name</label>
                        <input type="text" class="form-control" id="lastname" name="lastname" placeholder="Enter last name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="gender">Gender</label>
                    <select class="form-control" id="gender" name="gender" required>
                        <option value="" disabled selected>Select gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                        <option value="prefer_not_to_say">Prefer not to say</option>
                    </select>
                </div>

                <div class="form-group" style="margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem;">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Submit Data
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check"></i> Data submitted successfully!
    </div>

    <script>
        document.getElementById('studentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            btn.disabled = true;

            const formData = {
                student_id: document.getElementById('student_id').value,
                firstname: document.getElementById('firstname').value,
                lastname: document.getElementById('lastname').value,
                gender: document.getElementById('gender').value
            };

            try {
                const response = await fetch('/form', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if(response.ok) {
                    const result = await response.json();
                    console.log('Server response:', result);
                    
                    // Show success toast
                    const toast = document.getElementById('toast');
                    toast.classList.add('show');
                    
                    // Reset form
                    this.reset();

                    setTimeout(() => {
                        toast.classList.remove('show');
                    }, 3000);
                }
            } catch (error) {
                console.error('Error submitting form:', error);
                alert('An error occurred while submitting data.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
